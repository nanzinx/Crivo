# Crivo: banco + backend + frontend (+ HTTPS opcional com Caddy).
#   Rede interna:  cp .env.example .env  (preencha)  ->  docker compose up -d --build
#                  Painel: http://<servidor>:3000 · webhook do Argus: http://<servidor>:8000/api/v1/webhooks/argus
#   Na internet:   ./scripts/preparar_servidor.sh crivo.suaempresa.com.br  ->  docker compose --profile https up -d --build
#                  Painel e webhook em https://crivo.suaempresa.com.br (certificado automático)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crivo
      POSTGRES_USER: crivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crivo -d crivo"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crivo:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/crivo
      # Caminhos dentro do container (a pasta ./data do servidor é montada em /srv/data)
      RECORDINGS_DIR: /srv/data/gravacoes
      LEGACY_CSV: /srv/data/relatorio_escuta_gravacoes.csv
      LEGACY_HTML: /srv/data/dashboard_gravacoes.html
      CRUZAR_CSV: /srv/data/cruzar_dados.csv
      ARGUS_DOWNLOAD_DIR: /srv/data/argus
    volumes:
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000" # o Argus precisa alcançar o webhook

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      CRIVO_DOMINIO: ${CRIVO_DOMINIO:-localhost}  # o domínio público (scripts/preparar_servidor.sh preenche)
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
